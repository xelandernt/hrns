[project]
name = "harness-workspace"
version = "0.1.0"
description = "Programmable Pydantic AI agents with an interoperable ACP terminal and hosting"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["harness-protocol", "harness-runtime", "harness-client", "harness-server"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
harness-protocol = { workspace = true }
harness-runtime = { workspace = true }
harness-client = { workspace = true }
harness-server = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "ruff>=0.11", "build>=1.2", "httpx>=0.28"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::pydantic_ai_harness.experimental.HarnessExperimentalWarning"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
