[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "hrns"
dynamic = ["version"]
description = "Programmable Pydantic AI agents with an ACP adapter"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.10,<3",
    "cyclopts>=3,<6",
    "platformdirs>=4",
    "tomli-w>=1.2,<2",
    "keyring>=25",
]

[project.optional-dependencies]
client = [
    "agent-client-protocol>=1.0.0rc3,<2",
    "textual>=8.2,<9",
    "websockets>=13,<16",
    "PyYAML>=6,<7",
    "fastmcp-slim[client]>=3.3,<5",
    "mcp>=2.3,<3",
]
server = [
    "agent-client-protocol>=1.0.0rc3,<2",
    "fastmcp-slim[client]>=3.3,<5",
    "mcp>=2.3,<3",
    "pydantic-ai-slim[mcp,openai,anthropic]>=2.57.0,<3",
    "pydantic-ai-harness[coder]>=0.57.0,<2",
    "fastapi>=0.156,<1",
    "starlette>=0.47,<2",
    "uvicorn>=0.35",
    "websockets>=13,<16",
    "pydantic-ai-skills>=2.1,<3",
]

[project.scripts]
hrns = "hrns.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.11",
    "build>=1.2",
    "httpx>=0.28",
    "pyrefly>=1.4.0",
    "types-pyyaml>=6",
    "prek>=0.5.7",
]
docs = [
    "mkdocstrings-python>=2.0.10",
    "zensical>=0.0.67,<0.1",
]

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.1"

[tool.hatch.build.targets.wheel]
packages = ["src/hrns"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/LICENSE"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["hrns"]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
