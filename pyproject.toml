[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "hrns"
dynamic = ["version"]
description = "Programmable Pydantic AI agents with an interoperable ACP terminal and hosting"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.10,<3",
    "platformdirs>=4",
    "tomli-w>=1.2,<2",
    "agent-client-protocol>=0.11,<0.12",
    "textual>=8.2,<9",
    "httpx>=0.28,<1",
    "websockets>=15,<18",
    "keyring>=25",
    "fastmcp-slim[client]>=3.3,<5",
    "pydantic-ai-slim[mcp,openai]==2.57.0",
    "pydantic-ai-harness[acp]==0.57.0",
    "PyYAML>=6,<7",
    "packaging>=24",
    "pydantic-ai-skills>=2.1,<3",
]

[project.optional-dependencies]
anthropic = [
    "pydantic-ai-slim[anthropic]==2.57.0",
]
server = [
    "fastapi>=0.156,<1",
    "starlette>=0.47,<2",
    "uvicorn>=0.35",
]
postgres = [
    "psycopg[binary]>=3.2",
]
all = [
    "hrns[server,anthropic,postgres]",
]

[project.scripts]
hrns = "hrns.client.cli:main"
hrns-host = "hrns.runtime.cli:main"
hrns-local = "hrns.runtime.local:main"

[dependency-groups]
dev = [
    "ruff>=0.11",
    "build>=1.2",
    "httpx>=0.28",
    "pyrefly>=1.4.0",
    "types-pyyaml>=6",
    "prek>=0.5.7",
]
docs = [
    "mkdocstrings-python>=2.0.10",
    "zensical>=0.0.67,<0.1",
]

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.1"

[tool.hatch.build.targets.wheel]
packages = ["src/hrns"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/LICENSE"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["hrns"]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
