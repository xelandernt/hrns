[build-system]
requires = ["hatchling", "uv-dynamic-versioning>=0.7.0"]
build-backend = "hatchling.build"

[project]
name = "hrns"
dynamic = ["version", "dependencies", "optional-dependencies"]
description = "Programmable Pydantic AI agents with an ACP adapter"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"

[project.scripts]
hrns = "hrns.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.11",
    "build>=1.2",
    "httpx>=0.28",
    "pyrefly>=1.4.0",
    "types-pyyaml>=6",
    "prek>=0.5.7",
]
docs = [
    "mkdocstrings-python>=2.0.10",
    "zensical>=0.0.67,<0.1",
]

[tool.uv.workspace]
members = ["hrns_slim"]

[tool.uv.sources]
hrns = { workspace = true }
hrns-slim = { workspace = true }

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
pattern = "default-unprefixed"
style = "pep440"
bump = true
fallback-version = "0.0.1"

[tool.hatch.metadata.hooks.uv-dynamic-versioning]
dependencies = ["hrns-slim[client,server]=={{ version }}"]

[tool.hatch.metadata.hooks.uv-dynamic-versioning.optional-dependencies]
ag-ui = ["hrns-slim[ag-ui]=={{ version }}"]

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.sdist]
include = ["/README.md", "/LICENSE"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["hrns_slim"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["hrns"]

[tool.pyrefly]
search-path = ["hrns_slim"]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
