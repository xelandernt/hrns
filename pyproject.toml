[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harness"
version = "0.1.0"
description = "Programmable Pydantic AI agents with an interoperable ACP terminal and hosting"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.10,<3",
    "platformdirs>=4",
    "tomli-w>=1.2,<2",
]

[project.optional-dependencies]
client = [
    "agent-client-protocol>=0.11,<0.12",
    "textual>=8.2,<9",
    "httpx>=0.28,<1",
    "websockets>=15,<18",
    "keyring>=25",
]
runtime = [
    "pydantic-ai-slim==2.57.0",
    "pydantic-ai-harness[acp]==0.57.0",
    "PyYAML>=6,<7",
    "packaging>=24",
]
server = [
    "starlette>=0.47,<2",
    "uvicorn>=0.35",
    "websockets>=15,<18",
]
openai = [
    "harness[runtime]",
    "pydantic-ai-slim[openai]==2.57.0",
]
anthropic = [
    "harness[runtime]",
    "pydantic-ai-slim[anthropic]==2.57.0",
]
postgres = [
    "harness[runtime]",
    "psycopg[binary]>=3.2",
]
all = [
    "harness[client,runtime,server,openai,anthropic,postgres]",
]

[project.scripts]
hrns = "harness.client.cli:main"
harness-host = "harness.runtime.host:main"
harness-local = "harness.runtime.local:main"
harness-server = "harness.server.cli:main"

[dependency-groups]
dev = ["ruff>=0.11", "build>=1.2", "httpx>=0.28"]

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/LICENSE"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["harness"]
