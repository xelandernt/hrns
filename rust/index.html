<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>hrns</title>
    <link rel="icon" href="data:,">
    <link data-trunk rel="rust" data-target-name="hrns_tui">
    <link data-trunk rel="copy-file" href="npm/dist/terminal.js">
    <style>
      html, body { height: 100%; margin: 0; overflow: hidden; background: #121212; }
      #terminal { width: 100%; height: 100%; }
      #terminal :focus-visible { outline: 1px solid #80e0df; outline-offset: -1px; }
    </style>
  </head>
  <body>
    <main id="terminal"></main>
    <script type="module">
      import { attachTerminal } from "./terminal.js";

      function start() {
        const params = new URLSearchParams(location.search);
        const options = Object.fromEntries(["endpoint", "cwd", "session", "theme"]
          .map((key) => [key, params.get(key) ?? undefined]));
        attachTerminal(window.wasmBindings.WebTerminal, document.getElementById("terminal"), options).focus();
      }
      if (window.wasmBindings) start();
      else window.addEventListener("TrunkApplicationStarted", start, { once: true });
    </script>
  </body>
</html>
