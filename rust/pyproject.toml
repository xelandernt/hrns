[build-system]
requires = ["maturin>=1.14,<2"]
build-backend = "maturin"

[project]
name = "hrns-tui"
description = "Native Ratatui client for Agent Client Protocol"
requires-python = ">=3.11"
dynamic = ["version"]
license = "MIT"

[tool.maturin]
bindings = "bin"
locked = true
strip = true

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "src/**/*.rs" },
]
