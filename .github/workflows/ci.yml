name: verify
on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest]
        python: ['3.11', '3.12', '3.13', '3.14', '3.15']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - uses: extractions/setup-just@v4
      - run: just install
      - run: just check

  rust-preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
      - run: cargo +stable fmt --check
      - run: cargo +stable clippy --locked -- -D warnings
      - run: cargo +stable build --locked
      - run: cargo +stable build --locked --target wasm32-unknown-unknown

  rust-wheels:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --locked --out dist
          working-directory: rust
          target: ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.target }}
          path: rust/dist/*.whl
          if-no-files-found: error

  web-bundle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.21.14
      - run: trunk build --locked --release
      - uses: actions/upload-artifact@v7
        with:
          name: web-bundle
          path: rust/dist/
          if-no-files-found: error

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: '3.15'
          enable-cache: true
      - run: uv sync --locked --only-group docs
      - run: uv run --only-group docs zensical build --clean --strict
