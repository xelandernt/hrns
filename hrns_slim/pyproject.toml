[build-system]
requires = ["hatchling", "uv-dynamic-versioning>=0.7.0"]
build-backend = "hatchling.build"

[project]
name = "hrns-slim"
dynamic = ["version", "dependencies", "optional-dependencies"]
description = "Programmable Pydantic AI agents with an ACP adapter, slim package"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"

[tool.hatch.metadata.hooks.uv-dynamic-versioning]
dependencies = [
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.10,<3",
    "cyclopts>=3,<6",
    "platformdirs>=4",
    "tomli-w>=1.2,<2",
    "keyring>=25",
]

[tool.hatch.metadata.hooks.uv-dynamic-versioning.optional-dependencies]
client = [
    "agent-client-protocol>=1.0.0rc3,<2",
    "textual>=8.2,<9",
    "websockets>=13,<16",
    "PyYAML>=6,<7",
    "fastmcp-slim[client]>=3.3,<5",
    "mcp>=2.3,<3",
]
server = [
    "agent-client-protocol>=1.0.0rc3,<2",
    "fastmcp-slim[client]>=3.3,<5",
    "mcp>=2.3,<3",
    "pydantic-ai-slim[mcp,openai,anthropic]>=2.57.0,<3",
    "pydantic-ai-harness[coder]>=0.57.0,<2",
    "fastapi>=0.156,<1",
    "starlette>=0.47,<2",
    "uvicorn>=0.35",
    "websockets>=13,<16",
    "pydantic-ai-skills>=2.1,<3",
    "loro>=1.17.1,<2",
]

ag-ui = [
    "pydantic-ai-slim[ag-ui]>=2.57.0,<3",
]

[project.scripts]
hrns = "hrns.cli:main"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
pattern = "default-unprefixed"
style = "pep440"
bump = true
fallback-version = "0.0.1"

[tool.hatch.build.targets.wheel]
packages = ["hrns"]

[tool.hatch.build.targets.sdist]
include = ["/hrns", "/README.md", "/LICENSE"]
