[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harness-client"
version = "0.1.0"
description = "Standalone Textual ACP terminal, headless runner and WebSocket bridge"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["harness-protocol==0.1.0", "agent-client-protocol>=0.11,<0.12", "textual>=8.2,<9", "httpx>=0.28,<1", "websockets>=15,<18", "platformdirs>=4", "keyring>=25"]

[project.scripts]
harness = "harness_client.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_client"]

[tool.uv.sources]
harness-protocol = { workspace = true }
