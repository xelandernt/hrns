[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harness-config"
version = "0.1.0"
description = "Shared local Harness settings without AI or UI dependencies"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["pydantic-settings>=2.10,<3", "platformdirs>=4", "tomli-w>=1.2,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/harness_config"]
