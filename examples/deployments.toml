# harness-server deployment catalog (example)
#
# One [[deployment]] entry describes one *immutable revision* of an installed
# agent environment: its worker command, working directory, workspace roots,
# resource bindings, and resolved lockfile. A rebuilt environment always gets
# a new id; old revisions stay listed so existing sessions keep launching the
# environment they were created against.
#
# Security notes:
#   * Only SHA-256 token hashes belong in this file, never plaintext tokens:
#         printf '%s' 'YOUR-TOKEN' | shasum -a 256
#   * `command` is an argv array executed directly, never through a shell.
#     Prefer an absolute path into the deployment's virtual environment
#     (`.../bin/harness-host`); a bare name is resolved through PATH and is
#     suitable for local development only.
#   * Environment keys beginning with HARNESS_ are reserved for the server's
#     own principal/deployment contract and are rejected here.
#
# Validate without serving:
#     harness-server --config examples/deployments.toml --check
# Serve (TLS terminated by a proxy in production):
#     harness-server --config examples/deployments.toml --host 127.0.0.1 --port 8080
#
# See docs/SERVER.md for every field, the HTTP/WebSocket contract and the
# TLS deployment recipe, and docs/CONTRACTS.md for the worker environment.

[server]
host = "127.0.0.1"
port = 8080
# Enforce wss/https for every non-loopback client. A TLS terminator in front
# of the server must forward X-Forwarded-Proto: https (trusted proxy only).
require_tls = true
forwarded_allow_ips = ["127.0.0.1"]
store_path = "var/harness-store"
log_level = "info"

# Capacity and bounded cleanup for worker processes.
max_worker_count = 16
max_connections_per_principal = 4
worker_env_passthrough = ["PATH", "HOME", "TMPDIR", "LANG"]
worker_term_grace_seconds = 10.0
worker_kill_grace_seconds = 5.0
outbound_queue_limit = 1024
outbound_stall_timeout_seconds = 30.0
stderr_tail_bytes = 65536

# ---------------------------------------------------------------------------
# Deployment revisions
# ---------------------------------------------------------------------------

[[deployment]]
id = "coder.r1"
name = "Coder"
version = "1.2.0"
description = "Pydantic AI coder agent: filesystem, shell, planning, skills, and optional memory."
recommended = true
# Replace with the absolute path inside the coder-1.2.0 environment, e.g.
#   ["/opt/harness/envs/coder-1.2.0/bin/harness-host"]
command = ["harness-host"]
cwd = "var/deployments/coder-1.2.0"
allowed_cwds = ["/srv/workspaces/coder", "/srv/workspaces/example"]
default_cwd = "/srv/workspaces/coder"
env_from_environment = ["MODEL_API_KEY"]
lockfile_path = "locks/coder-1.2.0.lock"
lockfile_sha256 = "329370fe078f5660ab9984858d7cd2638c05bf9fc4a7870327e5179d64d0f8b4"

[deployment.env]
# Deployment resource bindings supplied by the operator, not the client.
SANDBOX_BACKEND = "e2b"

[[deployment]]
# The previous revision remains addressable for sessions pinned to it.
id = "coder.r0"
name = "Coder"
version = "1.1.0"
description = "Previous coder revision retained for existing sessions."
command = ["harness-host"]
cwd = "var/deployments/coder-1.1.0"
allowed_cwds = ["/srv/workspaces/coder"]
default_cwd = "/srv/workspaces/coder"
env_from_environment = ["MODEL_API_KEY"]

[[deployment]]
id = "researcher.r2"
name = "Researcher"
version = "0.9.1"
description = "Search, fetch, and planning agent without a workspace sandbox."
command = ["harness-host"]
cwd = "var/deployments/researcher-0.9.1"
allowed_cwds = ["/srv/workspaces/research"]
default_cwd = "/srv/workspaces/research"
lockfile_path = "locks/researcher-0.9.1.lock"
lockfile_sha256 = "0032fc4ceca62cab052ad0bd2ecd2c8c17805c4922b810259d114e7cf718264f"

# ---------------------------------------------------------------------------
# Principals: bearer tokens (hashes) and the revisions they may use
# ---------------------------------------------------------------------------
# The hashes below are SHA-256 of the placeholder tokens
# "change-me-coder-token" and "change-me-research-token". Replace both the
# token and its hash before exposing the server.

[[principal]]
id = "alice"
token_hashes = ["a6f105c2b60efab01e7c355e484cd21181415b5c9d84a4b7bdb3c3b9985173f3"]
allowed_agent_ids = ["coder.r1", "coder.r0", "researcher.r2"]

[[principal]]
id = "bob"
token_hashes = ["c3b3b46f8a71079c911500b6d5823a0d6151c9c4b823b0bc4187d8c2f1495b0a"]
